name: publish

on:
  push:
    branches: [main]

# Runs queue, so an older run always finishes before a newer one and `latest`
# ends on the newest commit. Cancelling instead could stop a run mid-push.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

# `bash` runs with pipefail; the default shell does not.
defaults:
  run:
    shell: bash

env:
  IMAGE: gn00678465/beancount-fava

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest
      - id: versions
        # Tags come from what the tested image actually contains.
        run: |
          installed() {
            docker run --rm beancount-fava:test python -c \
              "from importlib.metadata import version; print(version('$1'))"
          }
          # Assign first: a failed substitution inside `echo` would not stop the step.
          fava=$(installed fava)
          beancount=$(installed beancount)
          test -n "$fava" && test -n "$beancount"
          echo "fava=$fava" >> "$GITHUB_OUTPUT"
          echo "beancount=$beancount" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.versions.outputs.fava }}-beancount${{ steps.versions.outputs.beancount }}
            type=raw,value=${{ steps.versions.outputs.fava }}
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.fava }}-beancount${{ steps.versions.outputs.beancount }}-{{sha}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
