name: publish

on:
  push:
    branches: [main]

# A slower, older run must not move `latest` back after a newer one finished.
concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: gn00678465/beancount-fava

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv run pytest
      - id: versions
        # Tags come from what the tested image actually contains.
        run: |
          installed() {
            docker run --rm beancount-fava:test python -c \
              "from importlib.metadata import version; print(version('$1'))"
          }
          echo "fava=$(installed fava)" >> "$GITHUB_OUTPUT"
          echo "beancount=$(installed beancount)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.versions.outputs.fava }}-beancount${{ steps.versions.outputs.beancount }}
            type=raw,value=${{ steps.versions.outputs.fava }}
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.fava }}-beancount${{ steps.versions.outputs.beancount }}-{{sha}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
