[project]
name = "beancount-fava-image"
version = "0"
description = "Pinned Python environment for the beancount + fava image"
requires-python = "==3.14.*"
dependencies = [
    "beancount==3.2.3",
    "beanprice==2.1.0",
    "fava==1.30.16",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# ruff formats Python code blocks inside Markdown; the research notes quote upstream code verbatim.
extend-exclude = ["docs"]
